version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Dev/CI-only tooling churns fast (transitive vite/esbuild/etc. bumps);
      # batch it into one PR a week instead of one per package.
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1
      # only, and TS 7 has no stable JS API yet. Drop this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
